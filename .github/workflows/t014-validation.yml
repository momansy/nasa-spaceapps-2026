name: T014 isolated validation

on:
  push:
    branches:
      - ci/t014-validation-20261114
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out T014 implementation
        uses: actions/checkout@v4
        with:
          ref: feature/t014-campaign-modes-chatgpt
      - name: Set up .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore and run Release tests
        shell: bash
        run: |
          set -o pipefail
          dotnet --info
          dotnet test core/dotnet~ --configuration Release --logger "trx;LogFileName=t014.trx" 2>&1 | tee t014-dotnet-test.txt
      - name: Upload test log and TRX results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t014-validation-results
          path: |
            t014-dotnet-test.txt
            core/dotnet~/**/TestResults/*.trx
          if-no-files-found: warn
